name: Compilar APK do ROMUS Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar ROMUS.apk
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do Capacitor
        run: |
          cd mobile
          npm install

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Dar permissão de execução ao Gradle
        run: chmod +x mobile/android/gradlew

      - name: Compilar APK Nativo do Android
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar ROMUS.apk para Download
        uses: actions/upload-artifact@v4
        with:
          name: ROMUS-Mobile-Instalador-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
